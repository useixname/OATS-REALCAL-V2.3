[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oats-realcal"
version = "1.0.0"
description = "OATS mechanism and REAL-CAL reproducibility code"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Qingyong Deng"},
  {name = "Tao Mo"},
  {name = "Liangkun Ouyang"},
  {name = "Anfeng Liu"},
]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
]
external = [
  "psutil>=5.9,<8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

